name: gusu-expanded-book-page-link-harvest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gusu_cma_api_enrich.yml"
      - "projects/gusu_vonderburg_2026-08-18/scripts/harvest_book_page_image_links.py"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest public catalogue sample-image links
        shell: bash
        run: |
          set -euo pipefail
          python projects/gusu_vonderburg_2026-08-18/scripts/harvest_book_page_image_links.py \
            | tee /tmp/gusu_expanded_book_links.txt
      - name: Commit expanded link metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/gusu_vonderburg_2026-08-18/latest/book_page_link_harvest/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Expand public Gusu catalogue sample-image links [gusu-book-links]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
