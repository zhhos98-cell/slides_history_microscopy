name: gusu-blog-text-concordance

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/gusu_vonderburg_2026-08-18/scripts/build_blog_text_concordance.py'
      - '.github/workflows/gusu_blog_text_concordance.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 rapidfuzz

      - name: Build blog-text concordance
        run: python projects/gusu_vonderburg_2026-08-18/scripts/build_blog_text_concordance.py

      - name: Commit derived concordance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/gusu_vonderburg_2026-08-18/latest/blog_text_concordance/
          if git diff --cached --quiet; then
            echo 'No concordance changes to commit.'
          else
            git commit -m 'Build Gusu blog-text concordance [gusu-text]'
            git push
          fi
