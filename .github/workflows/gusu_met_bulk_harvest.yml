name: gusu-calibrated-sample-header-ocr

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gusu_met_bulk_harvest.yml"
      - "projects/gusu_vonderburg_2026-08-18/scripts/ocr_calibrated_public_sample_headers.py"

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install narrow OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --disable-pip-version-check opencv-python-headless numpy
      - name: OCR four calibrated public samples
        shell: bash
        run: |
          set -euo pipefail
          python projects/gusu_vonderburg_2026-08-18/scripts/ocr_calibrated_public_sample_headers.py \
            | tee /tmp/gusu_header_ocr.txt
      - name: Commit OCR evidence candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/gusu_vonderburg_2026-08-18/latest/public_sample_header_ocr/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "OCR calibrated Gusu sample headers [gusu-header-ocr]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
