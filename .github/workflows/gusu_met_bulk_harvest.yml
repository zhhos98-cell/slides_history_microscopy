name: gusu-plate-aware-book-metadata-ocr

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gusu_met_bulk_harvest.yml"
      - "projects/gusu_vonderburg_2026-08-18/scripts/ocr_plate_aware_book_metadata.py"

permissions:
  contents: write

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR and geometric dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --disable-pip-version-check opencv-python-headless numpy
      - name: Locate plates by SIFT and OCR only calibrated metadata regions
        shell: bash
        run: |
          set -euo pipefail
          python projects/gusu_vonderburg_2026-08-18/scripts/ocr_plate_aware_book_metadata.py \
            | tee /tmp/gusu_plate_aware_ocr.txt
      - name: Commit plate-aware OCR evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/gusu_vonderburg_2026-08-18/latest/plate_aware_ocr/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "OCR plate-aware Gusu book metadata [gusu-plate-ocr]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
