name: gusu-met-v2-live-core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gusu_met_bulk_harvest.yml"
      - "projects/gusu_vonderburg_2026-08-18/scripts/build_met_v2_core.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Met v2 working 107 core
        shell: bash
        run: |
          set -euo pipefail
          LIVE="projects/gusu_vonderburg_2026-08-18/latest/met_live_suzhou/met_live_suzhou_2025_discovered.csv"
          FALLBACK="projects/gusu_vonderburg_2026-08-18/latest/met_official_api/met_gusu_api_enriched.csv"
          OUT="projects/gusu_vonderburg_2026-08-18/latest/met_v2"
          test -s "$LIVE"
          test -s "$FALLBACK"
          mkdir -p "$OUT"
          python projects/gusu_vonderburg_2026-08-18/scripts/build_met_v2_core.py "$LIVE" "$FALLBACK" --outdir "$OUT" | tee "$OUT/run_summary_stdout.txt"
      - name: Commit Met v2 products
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/gusu_vonderburg_2026-08-18/latest/met_v2/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build Met Gusu v2 working 107 core [gusu-met-v2]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
