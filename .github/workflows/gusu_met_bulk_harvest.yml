name: gusu-combined-working-220

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gusu_met_bulk_harvest.yml"
      - "projects/gusu_vonderburg_2026-08-18/scripts/build_combined_working220.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build combined provisional 220 museum-unit manifest
        shell: bash
        run: |
          set -euo pipefail
          CMA="projects/gusu_vonderburg_2026-08-18/latest/cma_v15/cma_gusu_v15_working_core_113.csv"
          MET="projects/gusu_vonderburg_2026-08-18/latest/met_v2/met_gusu_v2_working_core_107.csv"
          OUT="projects/gusu_vonderburg_2026-08-18/latest/combined_v2"
          test -s "$CMA"
          test -s "$MET"
          mkdir -p "$OUT"
          python projects/gusu_vonderburg_2026-08-18/scripts/build_combined_working220.py "$CMA" "$MET" --outdir "$OUT" | tee "$OUT/run_summary_stdout.txt"
      - name: Commit combined products
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/gusu_vonderburg_2026-08-18/latest/combined_v2/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build combined Gusu working 220 image manifest [gusu-combined-v2]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
