name: gusu-met-live-suzhou-discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gusu_met_bulk_harvest.yml"
      - "projects/gusu_vonderburg_2026-08-18/scripts/discover_met_suzhou_live.py"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover live Met 2025 Suzhou records from official Collection API
        shell: bash
        run: |
          set -euo pipefail
          OUT="projects/gusu_vonderburg_2026-08-18/latest/met_live_suzhou"
          mkdir -p "$OUT"
          python projects/gusu_vonderburg_2026-08-18/scripts/discover_met_suzhou_live.py --outdir "$OUT" --delay 0.05 | tee "$OUT/run_summary_stdout.txt"
      - name: Commit live discovery products
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/gusu_vonderburg_2026-08-18/latest/met_live_suzhou/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Discover live Met Suzhou 2025 records [gusu-met-live-suzhou]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
