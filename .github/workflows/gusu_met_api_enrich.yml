name: gusu-met-api-enrich

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gusu_met_api_enrich.yml"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enrich verified Met Gusu records from official API
        shell: bash
        run: |
          set -euo pipefail
          IN="projects/gusu_vonderburg_2026-08-18/latest/canonical_parts"
          OUT="projects/gusu_vonderburg_2026-08-18/latest/met_official_api"
          mkdir -p "$OUT"
          python projects/gusu_vonderburg_2026-08-18/scripts/enrich_met_api.py "$IN" --outdir "$OUT" --delay 0.08 | tee "$OUT/run_summary_stdout.txt"
      - name: Commit Met API enrichment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/gusu_vonderburg_2026-08-18/latest/met_official_api/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Enrich Met Gusu rows from official API [gusu-met-api]"
            git push origin HEAD:main
          fi
