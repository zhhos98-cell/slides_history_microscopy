name: one-time-slide-project-migration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate_from_blaschka.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone frozen microscope-slide project branch
        run: |
          rm -rf /tmp/slide-source
          git clone --depth 1 --branch slide-survey-actions-pilot \
            https://github.com/zhhos98-cell/Blachka_corpus.git /tmp/slide-source

      - name: Copy slide project snapshot except workflow files
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/slide-source/ ./

      - name: Commit migrated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate frozen microscope-slide project from Blachka_corpus"
          git push origin main
